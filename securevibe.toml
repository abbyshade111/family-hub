# securevibe.toml — what this app is, so `sv` knows which security requirements apply.
# Written by your AI coding tool (Claude Code); read it yourself before you trust the report.
manifest-version = 1

[app]
name = "Family Hub"
description = "A web app where members of a family each have their own login and share a calendar, a to-do list, a grocery list, and personal reminders. Each family's data is visible only to that family's members."
audience = "customers"    # other families sign up and use it; not yet confirmed by the owner
deployment = "internet"   # assumed until the owner says where it will run

[stack]
languages = ["python"]

[stack.run]
image = "python:3.12-slim"
build = ""                # packages are installed into ./vendor ahead of time; nothing is downloaded at start
# sv checks the app from another container on its fenced network, over plain HTTP, where a browser drops
# Secure cookies; FAMILY_HUB_INSECURE_COOKIES=1 is for this test run only. Production keeps Secure cookies,
# which tests/test_auth.py (test_session_cookie_flags) checks.
start = "FAMILY_HUB_INSECURE_COOKIES=1 python serve.py --host 0.0.0.0 --port $PORT"   # the production server, as in Procfile
test = "python tests/run_tests.py --junit /sv-reports/junit.xml"
test-report = "junit.xml"
health = "/health"

[stack.run.oidc]
# The generic provider (OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET) shares its code with Google and Apple.
# Someone new who signs in this way is sent to /signup/finish to choose a family before an account exists.
start = "/login/oidc"
private = "/account"

[stack.run.users]
# The app's data lives under /tmp/family-hub (FAMILY_HUB_DATA), never in the app's folder.
seed = "python seed.py"
signup = { path = "/signup", form = { email = "{user}", password = "{password}", display_name = "Test Person", family_name = "Test Family", csrf_token = "{csrf}" } }
login  = { path = "/login",  form = { email = "{user}", password = "{password}", csrf_token = "{csrf}" } }
logout = { path = "/logout", form = { csrf_token = "{csrf}" } }
private = ["/", "/calendar", "/todos", "/groceries", "/reminders", "/account"]
admin = ["/family"]
admin-actions = [{ path = "/family/rename", form = { name = "{marker}", csrf_token = "{csrf}" }, check = "/" }]
owned = { create = { path = "/todos", form = { title = "{marker}", csrf_token = "{csrf}" } }, read = "/todos/{id}" }
change-password = { path = "/account/password", form = { current = "{password}", new = "{new_password}", csrf_token = "{csrf}" } }
delete-account = { path = "/account/delete", form = { password = "{password}", csrf_token = "{csrf}" } }
browser = { text-form = "/todos", shows = "/todos" }
totp = { path = "/login/2fa", form = { code = "{code}", csrf_token = "{csrf}" } }
# The seeded admin has no authenticator app, and admins need one for family settings, so the admin
# checks will find the admin turned away from /family as well: that is the owner's rule working.

[data]
# Email addresses and names (contact), hashed passwords (credentials), calendar entries, tasks and
# reminders about family life (other-personal). Families include children, who may have accounts
# or be named in entries, so `children` is listed.
categories = ["contact", "credentials", "children", "other-personal"]

[capabilities]
auth = true
oauth = true                  # Sign in with Google / Apple / another OpenID Connect provider (familyhub/oidc.py)
authorization-server = false
mcp-server = false
jwt = false
uploads = false
payments = false
email = false
public-api = false
scheduler = true              # tools/backup.py is meant to run from the host's cron; the app itself starts no background jobs
multi-tenant = true           # each family is a separate group whose data must stay apart
webrtc = false
out-of-band-auth = false
# shared-hostname = ?         # depends on where it is deployed; not known yet
multiple-services = false
external-apis = ["api.pwnedpasswords.com", "accounts.google.com", "oauth2.googleapis.com", "appleid.apple.com"]
# api.pwnedpasswords.com: leaked-password check. The others: signing in with Google and Apple, when configured.
tls = "terminated-upstream"   # assumed: HTTPS is ended by a proxy or host in front of the app

[repository]
ci-cd = false
hosted-scm = true             # github.com/abbyshade111/family-hub: main protected by a ruleset (pull request required, no force pushes or deletion); secret scanning with push protection and Dependabot alerts on
outside-contributors = false  # the owner's decision, 2026-10-03: no contributions from outside people
iac = false

[capabilities.ai]
enabled = false
can-act = false
stores-history = false
moderation = false
rag = false
web-search = false
generates-media = false
mcp = false
training = false
self-hosted = false
multi-agent = false
multimodal = false

[policy]
failed-sign-ins = 5
within-minutes = 15
idle-timeout-minutes = 30
session-lifetime-minutes = 720
context-words = ["familyhub"]
fix-within-days = { critical = 7, high = 30, medium = 90, low = 180 }   # owner's decision, 2026-10-03

