#
# Keep the system journal, which holds Family Hub's request and security logs, on disk for 90
# days (the owner's rule, security-notes.md V16.1.1). Install as
# /etc/systemd/journald.conf.d/family-hub.conf, then: sudo systemctl restart systemd-journald
# This applies to the whole machine's journal, not only Family Hub.

[Journal]
Storage=persistent
MaxRetentionSec=90day
